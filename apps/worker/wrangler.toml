name = "evidensify"
main = "src/index.ts"
account_id = "f4fdca115257cafba64ba5fc828f4003"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[assets]
binding = "ASSETS"
directory = "../web/dist"

[vars]
SESSION_COOKIE_NAME = "evidensify_session"
SESSION_MAX_AGE = "1209600"

[[routes]]
pattern = "evidensify.com"
custom_domain = true

[[kv_namespaces]]
binding = "DATA_KV"
id = "b63aaa698f6d4b75b7e36f2d9994c655"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
